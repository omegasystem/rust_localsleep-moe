<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐈‍⬛ __TITLE__ // Kuro Ghost-in-the-Shell Tactical Reader</title>
<style>
  :root {
    --bg:#080b12; --panel:#0f1523; --panel-alt:#0b101b; --input-bg:#060911;
    --border:#22304a; --text:#e2e8f0; --muted:#8496b0;
    --cyan:#38bdf8; --green:#4ade80; --amber:#f59e0b; --red:#f87171; --purple:#c084fc;
    --tachi:#00f2fe; --reader-font-size:17px;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:0; height:100vh; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); color:var(--text); font-family:"JetBrains Mono","Fira Code","Noto Sans TC",monospace; font-size:13px; }
  header { height:48px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 14px; flex-shrink:0; z-index:20; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; color:var(--cyan); font-size:14px; }
  .badge { font-size:10.5px; padding:2px 8px; border-radius:4px; background:rgba(56,189,248,0.12); border:1px solid var(--cyan); color:var(--cyan); }
  .hdr-ctrls { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .btn { background:var(--panel-alt); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:4px 9px; font-family:inherit; font-size:11px; cursor:pointer; transition:0.15s; }
  .btn:hover { border-color:var(--cyan); color:#fff; }
  .btn.active { background:#064e3b; border-color:#10b981; color:#a7f3d0; box-shadow:0 0 10px rgba(16,185,129,0.28); }
  .btn.tachi-btn { border-color:var(--amber); color:var(--amber); }
  input.search { background:var(--input-bg); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:4px 8px; font-family:inherit; font-size:11px; width:140px; }
  .kpi-ribbon { background:var(--panel-alt); border-bottom:1px solid var(--border); padding:7px 14px; display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; flex-shrink:0; z-index:20; }
  .kpi-box { background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--cyan); border-radius:5px; padding:5px 10px; }
  .kpi-box .k { font-size:9.5px; color:var(--muted); text-transform:uppercase; }
  .kpi-box .v { font-size:16px; font-weight:800; margin-top:2px; color:var(--cyan); }
  .kpi-box .v.green { color:var(--green); } .kpi-box .v.amber { color:var(--amber); } .kpi-box .v.purple { color:var(--purple); }
  .workspace { flex:1; display:grid; grid-template-columns:300px 1fr 330px; min-height:0; position:relative; }
  .sidebar-left { background:var(--panel-alt); border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0; z-index:10; }
  .sec-hdr { padding:9px 12px; font-size:11px; font-weight:700; color:var(--cyan); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .chap-list { flex:1; overflow-y:auto; padding:9px; display:flex; flex-direction:column; gap:7px; }
  .chap-card { background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:8px 10px; cursor:pointer; transition:0.15s; }
  .chap-card:hover { border-color:var(--cyan); }
  .chap-card.selected { border:1px dashed var(--cyan); background:#131d33; box-shadow:inset 0 0 10px rgba(56,189,248,0.16); }
  .chap-top { display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:11.5px; margin-bottom:3px; }
  .chap-meta { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); }
  .node-tags { display:flex; gap:4px; margin-top:5px; flex-wrap:wrap; }
  .ntag { font-size:9px; padding:1px 5px; border-radius:3px; background:#192338; color:var(--muted); border:1px solid #2b3b59; }
  .ntag.done-human { color:var(--cyan); border-color:var(--cyan); }
  .ntag.done-tachi { color:var(--green); border-color:var(--green); }
  .ntag.done-omake { color:var(--amber); border-color:var(--amber); }
  /* Reader Center + Dynamic Ambient Canvas */
  .reader-col { display:flex; flex-direction:column; min-height:0; background:#070a11; position:relative; overflow:hidden; }
  canvas#bgCanvas { position:absolute; inset:0; width:100%; height:100%; opacity:0.22; pointer-events:none; z-index:1; }
  .read-progress { height:3px; background:var(--cyan); width:0%; transition:width 0.1s; z-index:5; }
  .autoread-bar { background:rgba(15,21,35,0.92); border-bottom:1px solid var(--border); padding:6px 16px; display:flex; align-items:center; gap:12px; font-size:11px; z-index:5; }
  .reader-scroll { flex:1; overflow-y:auto; padding:28px 44px 100px 44px; font-family:"Noto Serif TC","Noto Sans TC","PingFang TC",serif; font-size:var(--reader-font-size); line-height:1.95; color:#e5ecf6; position:relative; z-index:3; scroll-behavior:smooth; }
  .novel-container { max-width:790px; margin:0 auto; }
  .chapter-banner { position:relative; border:1px solid var(--border); border-left:4px solid var(--cyan); border-radius:6px; overflow:hidden; margin:28px 0 20px 0; background:rgba(15,21,35,0.85); padding:16px 20px; }
  .novel-h1 { font-family:"JetBrains Mono","Noto Sans TC",monospace; font-size:22px; color:var(--cyan); margin:0 0 6px 0; }
  .novel-h2 { font-family:"JetBrains Mono","Noto Sans TC",monospace; font-size:15.5px; color:var(--green); margin:24px 0 12px 0; padding:6px 12px; background:rgba(74,222,128,0.08); border-left:3px solid var(--green); border-radius:0 4px 4px 0; }
  .novel-h2.omake-hdr { color:var(--amber); background:rgba(245,158,11,0.1); border-left-color:var(--amber); }
  .novel-p { margin:0 0 15px 0; text-indent:2em; text-align:justify; letter-spacing:0.03em; padding:4px 8px; border-radius:4px; transition:background 0.25s; }
  .novel-p.reading-active { background:rgba(56,189,248,0.14); border-left:3px solid var(--cyan); box-shadow:0 0 12px rgba(56,189,248,0.12); }
  .dialogue { color:#7dd3fc; }
  .tachi-voice { color:#4ade80; font-weight:600; }
  .incarnate { color:#fbbf24; font-weight:700; text-shadow:0 0 8px rgba(245,158,11,0.3); }
  .sidebar-right { background:var(--panel-alt); border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0; overflow-y:auto; padding:11px; gap:10px; z-index:10; }
  .lore-box { background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:9px 11px; font-size:11.5px; line-height:1.6; color:#cbd5e1; white-space:pre-wrap; max-height:260px; overflow-y:auto; }
  canvas#sceneArtCanvas { width:100%; height:155px; background:var(--input-bg); border:1px solid var(--border); border-radius:5px; }
  canvas#densityCanvas { width:100%; height:130px; background:var(--input-bg); border:1px solid var(--border); border-radius:5px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span>🕷️ __TITLE__</span>
    <span class="badge" id="hdrStatus">FORGING...</span>
  </div>
  <div class="hdr-ctrls">
    <input type="text" class="search" id="inpSearch" placeholder="🔍 搜尋九課 / 攻殼車..." oninput="renderReader()">
    <button class="btn active" id="btnAll" onclick="selectFilter('ALL')">📚 全書連讀</button>
    <button class="btn tachi-btn" id="btnOmakeOnly" onclick="selectFilter('OMAKE')">🤖 只看攻殼車小劇場</button>
    <button class="btn" onclick="adjustFont(-1)">A-</button>
    <button class="btn" onclick="adjustFont(1)">A+</button>
    <button class="btn" onclick="location.reload()">🔄 刷新進度</button>
  </div>
</header>

<div class="kpi-ribbon">
  <div class="kpi-box"><div class="k">TOTAL CJK 漢字數 (目標 50K)</div><div class="v green" id="kCjk">0 字</div></div>
  <div class="kpi-box" style="border-left-color:var(--amber)"><div class="k">FRACTAL NODES</div><div class="v amber" id="kNodes">0 / 24 節點</div></div>
  <div class="kpi-box" style="border-left-color:var(--green)"><div class="k">TACHIKOMA OMAKE</div><div class="v green" id="kOmake">0 篇小劇場</div></div>
  <div class="kpi-box" style="border-left-color:var(--purple)"><div class="k">FILE SIZE</div><div class="v purple" id="kBytes">0 KB</div></div>
  <div class="kpi-box"><div class="k">CANVAS SCENE THEME</div><div class="v" id="kTheme" style="font-size:13px">NEON_RAIN</div></div>
  <div class="kpi-box" style="border-left-color:var(--green)"><div class="k">UPDATED AT</div><div class="v green" id="kTime" style="font-size:12px">--</div></div>
</div>

<div class="workspace">
  <div class="sidebar-left">
    <div class="sec-hdr"><span>🌳 三軌分形章節樹 (Human / AI / 小劇場)</span><span id="lblChapProg">0/8</span></div>
    <div class="chap-list" id="chapList"></div>
  </div>

  <div class="reader-col">
    <canvas id="bgCanvas" width="900" height="700"></canvas>
    <div class="read-progress" id="readBar"></div>
    <div class="autoread-bar">
      <button class="btn" id="btnAutoRead" onclick="toggleAutoRead()">▶️ 啟動實驗性自動閱讀 (Auto-Cruise)</button>
      <label>巡航速度: <input type="range" id="slAutoSpeed" min="1" max="10" step="0.5" value="3.5" style="width:90px;vertical-align:middle;" oninput="updateAutoSpeedLabel()"><span id="lblAutoSpeed"> 3.5x</span></label>
      <label style="cursor:pointer;"><input type="checkbox" id="chkParaFocus" checked> 🎯 段落聚焦高亮</label>
      <label style="cursor:pointer;"><input type="checkbox" id="chkBgCanvas" checked onchange="toggleBgCanvas()"> 🎨 動態賽博背景</label>
      <span id="autoReadStatus" style="margin-left:auto;color:var(--muted);">⏸️ 手動閱讀中 (點任意段落可直接定位聚焦)</span>
    </div>
    <div class="reader-scroll" id="readerScroll" onscroll="updateScrollBar()">
      <div class="novel-container" id="novelContent"></div>
    </div>
  </div>

  <div class="sidebar-right">
    <div class="sec-hdr" style="padding:0 0 4px 0;">
      <span>🎨 章節專屬 Canvas 視覺插畫</span>
      <select id="selCanvasTheme" onchange="forceCanvasTheme(this.value)" style="background:#060911;color:var(--cyan);border:1px solid var(--border);font-size:10px;padding:2px 4px;">
        <option value="auto">自動隨章節切換</option>
        <option value="neon_rain">🌧️ 新濱市霓虹夜雨</option>
        <option value="tachikoma_pod">🕷️ 塔奇克馬光學感測器</option>
        <option value="cyber_dive">🧠 電子腦量子深潛網格</option>
        <option value="oil_workshop">🛢️ 九課整備庫天然機油泡</option>
        <option value="optical_camo">💠 熱光學迷彩相位干擾</option>
        <option value="ghost_dawn">🌅 靈魂奇點黎明粒子</option>
      </select>
    </div>
    <canvas id="sceneArtCanvas" width="305" height="155"></canvas>
    <div class="sec-hdr" style="padding:4px 0;"><span>🧬 公安九課 × 攻殼車世界觀聖經</span></div>
    <div class="lore-box" id="loreBox"></div>
    <div class="sec-hdr" style="padding:4px 0;"><span>📊 24 節點字數與雙視角密度矩陣</span></div>
    <canvas id="densityCanvas" width="305" height="130"></canvas>
  </div>
</div>

<script>
const NOVEL_DATA = __PAYLOAD_JSON__;
let currentFilter = 'ALL';
let fontSize = 17;
let autoReadTimer = null;
let activeParaIdx = 0;
let currentArtTheme = 'neon_rain';
let animTick = 0;

function initUI() {
  document.getElementById('kCjk').textContent = NOVEL_DATA.total_cjk.toLocaleString() + ' 字';
  document.getElementById('kNodes').textContent = `${NOVEL_DATA.done_nodes} / ${NOVEL_DATA.total_nodes} 節點`;
  document.getElementById('kOmake').textContent = `${NOVEL_DATA.omake_count} 篇小劇場`;
  document.getElementById('kBytes').textContent = (NOVEL_DATA.total_chars / 1024).toFixed(1) + ' KB';
  document.getElementById('kTime').textContent = NOVEL_DATA.updated_at;
  document.getElementById('lblChapProg').textContent = `${NOVEL_DATA.done_chapters}/${NOVEL_DATA.chapters.length}`;
  document.getElementById('loreBox').textContent = NOVEL_DATA.global_contract || '';
  const stBadge = document.getElementById('hdrStatus');
  if (NOVEL_DATA.done_nodes >= NOVEL_DATA.total_nodes) {
    stBadge.textContent = `✅ 50K FORGE DONE (${NOVEL_DATA.total_cjk.toLocaleString()} 字)`;
    stBadge.style.borderColor = 'var(--green)'; stBadge.style.color = 'var(--green)';
  } else {
    stBadge.textContent = `⚡ FORGING (${NOVEL_DATA.done_nodes}/${NOVEL_DATA.total_nodes} 節點 | ${NOVEL_DATA.total_cjk.toLocaleString()} 字)`;
  }
  renderChapterCards();
  renderReader();
  drawDensityMatrix();
  requestAnimationFrame(animateCanvases);
}

function renderChapterCards() {
  const list = document.getElementById('chapList');
  list.innerHTML = '';
  NOVEL_DATA.chapters.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'chap-card' + (currentFilter === ch.id ? ' selected' : '');
    card.onclick = () => selectFilter(ch.id, ch.canvas_theme);
    const n1 = ch.nodes && ch.nodes[0] && ch.nodes[0].done;
    const n2 = ch.nodes && ch.nodes[1] && ch.nodes[1].done;
    const n3 = ch.nodes && ch.nodes[2] && ch.nodes[2].done;
    const n4 = ch.nodes && ch.nodes[3] && ch.nodes[3].done;
    card.innerHTML = `
      <div class="chap-top"><span>${ch.id}</span><span style="color:var(--green)">${ch.cjk_count.toLocaleString()} 字</span></div>
      <div style="font-size:11px;color:#cbd5e1;margin-bottom:3px;">${ch.title}</div>
      <div class="node-tags">
        <span class="ntag ${n1 ? 'done-human' : ''}">🎭 人物深描</span>
        <span class="ntag ${n2 ? 'done-human' : ''}">🕵️ 九課主線</span>
        <span class="ntag ${n3 ? 'done-tachi' : ''}">🕷️ 攻殼車AI</span>
        <span class="ntag ${n4 ? 'done-omake' : ''}">🛢️ 小劇場</span>
      </div>
    `;
    list.appendChild(card);
  });
}

function selectFilter(flt, theme) {
  currentFilter = flt;
  if (theme) currentArtTheme = theme;
  document.getElementById('btnAll').classList.toggle('active', flt === 'ALL');
  document.getElementById('btnOmakeOnly').classList.toggle('active', flt === 'OMAKE');
  renderChapterCards();
  renderReader();
  document.getElementById('readerScroll').scrollTop = 0;
  activeParaIdx = 0;
}

function formatParagraph(line) {
  let safe = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  safe = safe.replace(/(「[^」]+」)/g, '<span class="dialogue">$1</span>');
  safe = safe.replace(/(『[^』]+』)/g, '<span class="incarnate">$1</span>');
  safe = safe.replace(/(【[^】]+】)/g, '<span class="tachi-voice">$1</span>');
  const q = document.getElementById('inpSearch').value.trim();
  if (q) {
    const re = new RegExp(q.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'), 'gi');
    safe = safe.replace(re, m => `<mark style="background:var(--amber);color:#000;padding:0 2px;border-radius:2px;">${m}</mark>`);
  }
  return safe;
}

function renderReader() {
  const box = document.getElementById('novelContent');
  const htmlParts = [];
  let pCounter = 0;

  NOVEL_DATA.chapters.forEach(ch => {
    if (currentFilter !== 'ALL' && currentFilter !== 'OMAKE' && currentFilter !== ch.id) return;
    if (currentFilter !== 'OMAKE') {
      htmlParts.push(`
        <div class="chapter-banner" data-theme="${ch.canvas_theme || 'neon_rain'}">
          <div style="font-size:10px;color:var(--muted);">CHAPTER // CANVAS THEME: ${(ch.canvas_theme || 'neon_rain').toUpperCase()}</div>
          <div class="novel-h1">${ch.id}：${ch.title}</div>
          <div style="font-size:11px;color:var(--green);">本章字數：${ch.cjk_count.toLocaleString()} 字</div>
        </div>
      `);
    }
    (ch.nodes || []).forEach(nd => {
      if (currentFilter === 'OMAKE' && nd.kind !== 'omake') return;
      if (!nd.done) {
        htmlParts.push(`<div class="novel-h2">⏳ [${nd.label}] 地端 MoE 副腦正在鍛造中...</div>`);
        return;
      }
      const hdrCls = nd.kind === 'omake' ? 'novel-h2 omake-hdr' : 'novel-h2';
      const icon = nd.kind === 'human' ? '🕵️' : (nd.kind === 'tachi' ? '🕷️' : '🛢️');
      htmlParts.push(`<div class="${hdrCls}">${icon} ${nd.label} <small style="float:right;opacity:0.75;">${nd.cjk_count.toLocaleString()} 字</small></div>`);
      nd.content.split('\\n').forEach(rawLine => {
        const l = rawLine.trim();
        if (!l || l.startsWith('#')) return;
        htmlParts.push(`<p class="novel-p" data-pidx="${pCounter}" onclick="jumpToPara(${pCounter})">${formatParagraph(l)}</p>`);
        pCounter++;
      });
    });
  });
  box.innerHTML = htmlParts.join('\\n');
}

// === EXPERIMENTAL AUTO-READER (巡航自動閱讀與段落聚焦器) ===
function toggleAutoRead() {
  const btn = document.getElementById('btnAutoRead');
  if (autoReadTimer) {
    clearInterval(autoReadTimer);
    autoReadTimer = null;
    btn.classList.remove('active');
    btn.textContent = '▶️ 啟動實驗性自動閱讀 (Auto-Cruise)';
    document.getElementById('autoReadStatus').textContent = '⏸️ 自動閱讀已暫停';
    return;
  }
  btn.classList.add('active');
  btn.textContent = '⏸️ 暫停自動閱讀巡航';
  autoReadTimer = setInterval(stepAutoRead, 50);
}

function updateAutoSpeedLabel() {
  const v = document.getElementById('slAutoSpeed').value;
  document.getElementById('lblAutoSpeed').textContent = ` ${v}x`;
}

function stepAutoRead() {
  const sc = document.getElementById('readerScroll');
  const speed = parseFloat(document.getElementById('slAutoSpeed').value || '3.5');
  sc.scrollTop += speed * 0.65;

  if (document.getElementById('chkParaFocus').checked) {
    const paras = sc.querySelectorAll('.novel-p');
    const viewMid = sc.scrollTop + sc.clientHeight * 0.36;
    let bestP = null;
    paras.forEach(p => {
      if (p.offsetTop <= viewMid) bestP = p;
      p.classList.remove('reading-active');
    });
    if (bestP) {
      bestP.classList.add('reading-active');
      activeParaIdx = parseInt(bestP.dataset.pidx || '0', 10);
      document.getElementById('autoReadStatus').textContent = `🚀 自動巡航中 // 聚焦段落 #${activeParaIdx + 1} / ${paras.length}`;
    }
  }
  if (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 4) {
    toggleAutoRead();
    document.getElementById('autoReadStatus').textContent = '🏁 已巡航至本章底部';
  }
}

function jumpToPara(idx) {
  activeParaIdx = idx;
  const sc = document.getElementById('readerScroll');
  const paras = sc.querySelectorAll('.novel-p');
  paras.forEach(p => p.classList.toggle('reading-active', parseInt(p.dataset.pidx, 10) === idx));
}

function adjustFont(delta) {
  fontSize = Math.max(13, Math.min(26, fontSize + delta));
  document.documentElement.style.setProperty('--reader-font-size', fontSize + 'px');
}

function updateScrollBar() {
  const el = document.getElementById('readerScroll');
  const max = Math.max(1, el.scrollHeight - el.clientHeight);
  document.getElementById('readBar').style.width = Math.min(100, (el.scrollTop / max) * 100).toFixed(1) + '%';
  // Auto-detect visible chapter banner theme
  if (document.getElementById('selCanvasTheme').value === 'auto') {
    const banners = el.querySelectorAll('.chapter-banner');
    banners.forEach(b => {
      if (b.offsetTop <= el.scrollTop + 220) currentArtTheme = b.dataset.theme || 'neon_rain';
    });
    document.getElementById('kTheme').textContent = currentArtTheme.toUpperCase();
  }
}

function forceCanvasTheme(val) {
  if (val !== 'auto') {
    currentArtTheme = val;
    document.getElementById('kTheme').textContent = val.toUpperCase();
  }
}

function toggleBgCanvas() {
  document.getElementById('bgCanvas').style.display = document.getElementById('chkBgCanvas').checked ? 'block' : 'none';
}

// === PROCEDURAL CYBERPUNK / TACHIKOMA HTML5 CANVAS ART ENGINE ===
function drawCyberTheme(ctx, w, h, theme, t) {
  ctx.fillStyle = '#060911';
  ctx.fillRect(0, 0, w, h);
  if (theme === 'neon_rain') {
    for (let i = 0; i < 36; i++) {
      const x = ((i * 73) % w);
      const y = ((t * (3 + (i % 4)) + i * 47) % h);
      ctx.strokeStyle = i % 5 === 0 ? 'rgba(245,158,11,0.55)' : 'rgba(56,189,248,0.45)';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 18); ctx.stroke();
    }
  } else if (theme === 'tachikoma_pod') {
    const cx = w / 2, cy = h / 2;
    ctx.strokeStyle = 'rgba(0,242,254,0.45)';
    for (let r = 18; r < 90; r += 22) {
      ctx.beginPath(); ctx.arc(cx, cy, r + Math.sin(t * 0.05 + r) * 3, 0, Math.PI * 2); ctx.stroke();
    }
    for (let i = 0; i < 3; i++) {
      const ang = t * 0.03 + (i * Math.PI * 2 / 3);
      const ex = cx + Math.cos(ang) * 38, ey = cy + Math.sin(ang) * 24;
      ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(ex, ey, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  } else if (theme === 'oil_workshop') {
    for (let i = 0; i < 22; i++) {
      const x = ((i * 53 + Math.sin(t * 0.03 + i) * 15) % w);
      const y = h - ((t * 1.2 + i * 29) % h);
      ctx.fillStyle = i % 2 === 0 ? 'rgba(245,158,11,0.55)' : 'rgba(74,222,128,0.45)';
      ctx.beginPath(); ctx.arc(x, y, 4 + (i % 5), 0, Math.PI * 2); ctx.fill();
    }
  } else if (theme === 'cyber_dive') {
    ctx.strokeStyle = 'rgba(74,222,128,0.32)';
    for (let i = 0; i < 12; i++) {
      const y = ((t * 1.5 + i * 25) % h);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
  } else {
    for (let i = 0; i < 28; i++) {
      const x = (i * 37 + Math.cos(t * 0.02 + i) * 20) % w;
      const y = (i * 29 + Math.sin(t * 0.03 + i) * 20) % h;
      ctx.fillStyle = i % 3 === 0 ? 'rgba(192,132,252,0.55)' : 'rgba(56,189,248,0.45)';
      ctx.fillRect(x, y, 5, 5);
    }
  }
}

function animateCanvases() {
  animTick++;
  const sCvs = document.getElementById('sceneArtCanvas');
  if (sCvs) drawCyberTheme(sCvs.getContext('2d'), sCvs.width, sCvs.height, currentArtTheme, animTick);
  if (document.getElementById('chkBgCanvas').checked && animTick % 2 === 0) {
    const bCvs = document.getElementById('bgCanvas');
    if (bCvs) drawCyberTheme(bCvs.getContext('2d'), bCvs.width, bCvs.height, currentArtTheme, animTick);
  }
  requestAnimationFrame(animateCanvases);
}

function drawDensityMatrix() {
  const cvs = document.getElementById('densityCanvas');
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  const rows = Math.max(1, NOVEL_DATA.chapters.length);
  const cols = 4;
  const cw = cvs.width / cols;
  const ch = cvs.height / rows;
  NOVEL_DATA.chapters.forEach((chap, r) => {
    (chap.nodes || []).forEach((nd, c) => {
      if (!nd.done) ctx.fillStyle = '#090d16';
      else if (nd.kind === 'human') ctx.fillStyle = 'rgba(56,189,248,0.75)';
      else if (nd.kind === 'tachi') ctx.fillStyle = 'rgba(74,222,128,0.75)';
      else ctx.fillStyle = 'rgba(245,158,11,0.85)';
      ctx.fillRect(c * cw + 2, r * ch + 2, cw - 4, ch - 3);
    });
  });
}

window.addEventListener('DOMContentLoaded', initUI);
</script>
